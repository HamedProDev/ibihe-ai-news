name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-and-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          (npm run start -- -p 3100 > /tmp/next-start.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/api/briefing > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3100/api/briefing > /dev/null
      - name: Smoke test
        run: BASE_URL=http://localhost:3100 npm run smoke
